name: Validate EstateIQ
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          find . \( -path './.git' -o -path './node_modules' -o -path './dist' \) -prune -o \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Package staging website
        run: node scripts/package-site.mjs --staging
      - name: Check pages and safe package
        run: node scripts/check-site.mjs
      - name: Save staging package
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: estateiq-staging-${{ github.sha }}
          path: dist/
          if-no-files-found: error
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: estateiq-staging-${{ github.sha }}
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy draft to separate staging site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" && test -n "$NETLIFY_SITE_ID"
          npx --yes netlify-cli deploy --dir dist --alias estateiq-review --message "$GITHUB_SHA"
