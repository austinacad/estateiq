name: Validate EstateIQ
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          find . -path './.git' -prune -o -path './node_modules' -prune -o -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Check required pages
        run: test -f index.html && test -f dashboard.html && test -f auth.html && test -f worker/src/index.js
